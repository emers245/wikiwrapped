<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Wikipedia Wrapped</title>
<!-- Vendored, not from a CDN, so the app works offline (vendor/README.md). -->
<script src="/static/vendor/d3-7.9.0.min.js"></script>
<script src="/static/vendor/cytoscape-3.30.2.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Visible in the served markup rather than switched on by script, so it
     is up from the very first paint - before main.js has even fetched the
     dashboard - and comes down only once the thread graph is laid out. -->
<div id="loading">Launching...</div>

<header>
  <h1>Wikipedia Wrapped</h1>
  <nav id="mode-toggle">
    <button id="btn-umap" class="active">UMAP</button>
    <button id="btn-network">Threads</button>
  </nav>
  <button id="btn-panels" class="active" aria-expanded="true"
          aria-controls="panels" title="Hide summary panels">Panels</button>
  <div id="summary-line">loading...</div>
  <div id="data-warning" class="hidden"></div>
  <button id="btn-settings" class="header-btn" title="Sources, sync, and accounts">Settings</button>
</header>

<aside id="panels">
  <div id="panels-inner">
    <div class="panel" id="panel-categories"
         title="Click a topic to isolate it; click the background or press
                Escape to clear">
      <h2>Categories: you vs popular pages</h2><svg></svg>
    </div>
    <div class="panel" id="panel-daily"
         title="Drag the grips to pick a date range, drag the filled bar to
                move it, double-click to reset; play sweeps the range">
      <h2>Visits per day</h2><svg></svg>
    </div>
    <div class="panel" id="panel-hours"
         title="Click an hour to keep only pages read then; play steps
                through the day">
      <h2>Time of day</h2><svg></svg>
    </div>
  </div>
</aside>

<div id="panels-resizer" role="separator" aria-orientation="vertical"
     aria-label="Resize panels (arrow keys to adjust, double-click to reset)"
     tabindex="0"></div>

<main id="viz">
  <div id="umap-view">
    <canvas id="backdrop"></canvas>
    <svg id="umap-svg"></svg>
  </div>
  <div id="network-view" class="inactive"></div>
  <div id="viz-message" class="hidden"></div>
  <div id="popup" class="hidden"></div>
  <!-- Background sync/enrichment progress (GET /jobs). Floats over the
       visualization so it never shifts the layout grid. -->
  <div id="job-strip" class="hidden" role="status" aria-live="polite">
    <span id="job-message"></span>
    <span id="job-bar" class="hidden"><span id="job-bar-fill"></span></span>
    <span id="job-count"></span>
    <button id="job-reload" class="hidden">Reload</button>
    <button id="job-settings" class="hidden">Settings</button>
    <button id="job-dismiss" class="hidden" title="Dismiss">Close</button>
  </div>
</main>

<!-- First-run setup and Settings (setup.js). One overlay, two modes: a
     stepped wizard on first run, a single page from the Settings button. -->
<div id="setup" class="hidden" role="dialog" aria-modal="true"
     aria-labelledby="setup-title">
  <div id="setup-card">
    <div id="setup-head">
      <h2 id="setup-title"></h2>
      <span id="setup-step"></span>
    </div>
    <div id="setup-body"></div>
    <div id="setup-error" class="hidden" role="alert"></div>
    <div id="setup-foot">
      <button id="setup-back">Back</button>
      <span class="setup-spacer"></span>
      <button id="setup-cancel">Cancel</button>
      <button id="setup-next" class="primary">Next</button>
    </div>
  </div>
</div>

<script src="/static/panels.js"></script>
<script src="/static/map.js"></script>
<script src="/static/network.js"></script>
<script src="/static/main.js"></script>
<script src="/static/setup.js"></script>
</body>
</html>

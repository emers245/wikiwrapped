<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Wikipedia Wrapped</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Wikipedia Wrapped</h1>
  <nav id="mode-toggle">
    <button id="btn-umap" class="active">UMAP</button>
    <button id="btn-network">Network</button>
  </nav>
  <button id="btn-panels" class="active" aria-expanded="true"
          aria-controls="panels" title="Hide summary panels">Panels</button>
  <div id="summary-line">loading...</div>
</header>

<aside id="panels">
  <div id="panels-inner">
    <div class="panel" id="panel-categories">
      <h2>Categories: you vs popular pages</h2><svg></svg>
    </div>
    <div class="panel" id="panel-daily">
      <h2>Visits per day</h2><svg></svg>
    </div>
    <div class="panel" id="panel-hours">
      <h2>Time of day</h2><svg></svg>
    </div>
  </div>
</aside>

<main id="viz">
  <div id="umap-view">
    <canvas id="backdrop"></canvas>
    <svg id="umap-svg"></svg>
  </div>
  <div id="network-view" class="hidden"></div>
  <div id="viz-message" class="hidden"></div>
  <div id="popup" class="hidden"></div>
</main>

<script src="/static/panels.js"></script>
<script src="/static/map.js"></script>
<script src="/static/network.js"></script>
<script src="/static/main.js"></script>
</body>
</html>

# Developer environment for Wikipedia Wrapped (repo_spec S9, D8).
# Build:  conda env create -f environment.yml
# Verify: conda run -n wikipedia-wrapped python scripts/check_env.py --full
#
# This is the installed app's runtime spec (packaging/runtime.yml) plus
# developer tools. The first block below must stay identical to that file:
# tests/test_environment_specs.py fails if any runtime entry is missing
# here or differs, so the app is never developed against packages the
# installer would not ship. Change runtime entries in packaging/runtime.yml
# first, re-lock (packaging/README.md), then copy the change here.
name: wikipedia-wrapped
channels:
  - conda-forge
  - nodefaults
dependencies:
  # ======================================================================
  # Runtime: identical to packaging/runtime.yml (see the comments there)
  # ======================================================================
  - python=3.11.*
  - numpy=1.26.4
  - numba=0.60.0
  - llvmlite=0.43.0
  - umap-learn=0.5.7
  - scikit-learn=1.5.*
  - pynndescent=0.5.13
  - pytorch=2.10.0=cpu_*
  - sentence-transformers=3.2.1
  - requests=2.32.*
  - tqdm=4.*
  - tzlocal=5.*
  - platformdirs=4.*
  - networkx=3.*
  - google-api-python-client=2.*
  - google-auth-oauthlib=1.*
  - google-auth=2.*
  - fastapi=0.115.*
  - uvicorn=0.32.*
  - pip
  - proxy-tools=0.1.0
  # ======================================================================
  # Developer tools only (never shipped in the installers)
  # ======================================================================
  # -- Testing (httpx backs FastAPI's TestClient)
  - pytest=8.*
  - httpx=0.27.*
  # -- Ad-hoc inspection plots only (the app itself returns data, not plots)
  - matplotlib-base=3.9.*
  # -- Not imported anywhere in the repo (app, scripts, or tests); kept for
  #    now pending a decision to drop them (see packaging/README.md).
  - pandas=2.2.*
  - pyarrow=17.*
  - python-multipart=0.0.*
  # -- App window, from PyPI on every platform (conda-forge has no macOS
  #    build). Must match packaging/wheels/requirements.in; the installers
  #    ship the same version as pinned, hashed wheels.
  - pip:
      - pywebview==6.2.1
